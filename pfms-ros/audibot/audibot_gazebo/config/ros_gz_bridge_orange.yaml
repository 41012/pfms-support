#   direction: GZ_TO_ROS
- ros_topic_name: "/orange/camera/image_raw"
  gz_topic_name: "/orange_audibot/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
- ros_topic_name: "/orange/camera/camera_info"
  gz_topic_name: "/orange_audibot/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
