# CSonar
- ros_topic_name: "/husky/sonar"
  gz_topic_name: "/model/husky/sonar"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS